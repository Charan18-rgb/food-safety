packages:
  - 'packages/*'
  - 'apps/*'

allowBuilds:
  canvas: set this to true or false
  esbuild: true
  tesseract.js: true

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.20'
  - '@expo/env@2.4.3'
  - '@expo/fingerprint@0.20.11'
  - '@expo/metro-config@57.0.12'
  - expo-constants@57.0.16
  - expo-font@57.0.2
  - expo@57.0.18

patchedDependencies:
  react-native-reanimated@4.5.1: patches/react-native-reanimated@4.5.1.patch
  react-native-worklets@0.10.1: patches/react-native-worklets@0.10.1.patch
